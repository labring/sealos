name: Check PR commit messages

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commit-messages:
    name: Reject skip-ci markers
    runs-on: ubuntu-24.04
    steps:
      - name: Check commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const skipCiPattern = /\[(skip ci|ci skip|no ci|skip actions|actions skip)\]/i;
            const invalidCommits = commits.filter(({ commit }) => skipCiPattern.test(commit.message));

            if (invalidCommits.length > 0) {
              const details = invalidCommits
                .map(({ sha, commit }) => `- ${sha.slice(0, 12)} ${commit.message.split("\\n", 1)[0]}`)
                .join("\\n");
              core.setFailed(
                `PR commits must not contain GitHub skip-ci markers ([skip ci], [ci skip], [no ci], [skip actions], or [actions skip]).\\n${details}`,
              );
              return;
            }

            core.info(`Checked ${commits.length} PR commit(s); no skip-ci markers found.`);
