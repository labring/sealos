name: Build Service

on:
  workflow_call:
    inputs:
      module:
        description: "Service module name (account or vlogs)"
        required: true
        type: string
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: "Push image tag"
        default: "latest"
        required: false
        type: string
      disable_cilint:
        description: "Disable golangci-lint"
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      module:
        description: "Service module name"
        required: true
        type: choice
        options: [account, vlogs]
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: "Push image tag"
        default: "latest"
        required: false
        type: string
      disable_cilint:
        description: "Disable golangci-lint"
        default: false
        required: false
        type: boolean

env:
  GO_VERSION: "1.25"
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_REPO_PREFIX: ${{ secrets.ALIYUN_REPO_PREFIX && secrets.ALIYUN_REPO_PREFIX || secrets.ALIYUN_USERNAME && format('{0}/{1}', secrets.ALIYUN_REGISTRY, secrets.ALIYUN_USERNAME) || '' }}

  BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate service module
        env:
          MODULE: ${{ inputs.module }}
        run: |
          case "${MODULE}" in
            account|vlogs) ;;
            *) echo "Unsupported service module: ${MODULE}. Choose account or vlogs." >&2; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        if: ${{ inputs.module == 'vlogs' }}
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate vlogs deployment
        if: ${{ inputs.module == 'vlogs' }}
        run: |
          set -euo pipefail
          helm lint --strict service/vlogs/deploy/charts/vlogs-service
          helm lint --strict service/vlogs/deploy/charts/vlogs-service \
            -f service/vlogs/deploy/charts/vlogs-service/vlogs-service-values.yaml
          shellcheck service/vlogs/deploy/entrypoint.sh service/vlogs/scripts/merge-images.sh
          python3 -m venv "${RUNNER_TEMP}/vlogs-deploy-check"
          "${RUNNER_TEMP}/vlogs-deploy-check/bin/pip" install PyYAML==6.0.2
          "${RUNNER_TEMP}/vlogs-deploy-check/bin/python" service/vlogs/deploy/tests/test_deploy.py
          "${RUNNER_TEMP}/vlogs-deploy-check/bin/python" service/vlogs/deploy/tests/test_images.py

  golangci-lint:
    needs: validate-deploy
    if: ${{ !inputs.disable_cilint && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: service/${{ inputs.module }}
          args: --color=always --config=${{ github.workspace }}/.golangci.yml

  unit-test:
    name: Test ${{ inputs.module }} with race detector
    needs: validate-deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run Tests with race detector
        working-directory: service/${{ inputs.module }}
        run: go test -race ./... -count=1 -v

  image-build:
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image repo
        id: set_repo
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "GHCR_REPO=ghcr.io/${REPOSITORY_OWNER}/sealos-${MODULE}-service" >> "$GITHUB_ENV"
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            echo "ALIYUN_REPO=${ALIYUN_REPO_PREFIX}/sealos-${MODULE}-service" >> "$GITHUB_ENV"
          fi
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
            ${{ env.ALIYUN_REPO }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Set up Docker Buildx
        if: ${{ inputs.module == 'account' }}
        uses: docker/setup-buildx-action@v3
      - name: Login to Github Container Hub
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to Aliyun Registry
        if: ${{ inputs.push_image && env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Build
        if: ${{ inputs.module == 'account' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./service/${{ inputs.module }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GHCR_REPO }}${{ env.ALIYUN_REPO && format(',{0}', env.ALIYUN_REPO) || '' }}",name-canonical=true,push-by-digest=${{ inputs.push_image }},push=${{ inputs.push_image }}
      - name: Export digest
        if: ${{ inputs.module == 'account' }}
        env:
          TEMP_DIR: ${{ runner.temp }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${TEMP_DIR}/digests"
          touch "${TEMP_DIR}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: ${{ inputs.module == 'account' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.module }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Setup Go on native runner
        if: ${{ inputs.module == 'vlogs' }}
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile native binary
        if: ${{ inputs.module == 'vlogs' }}
        working-directory: service/vlogs
        env:
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/${ARCH}"
          go build -trimpath -ldflags "-s -w" -o bin/manager .
      - name: Package and publish native runtime image
        if: ${{ inputs.module == 'vlogs' }}
        env:
          ARCH: ${{ matrix.arch }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          set -euo pipefail
          IMAGE="${GHCR_REPO}:${BUILD_TAG}-${ARCH}"
          docker build -f service/vlogs/Dockerfile -t "${IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" service/vlogs
          if [[ "${PUSH_IMAGE}" == true ]]; then
            docker push "${IMAGE}"
            if [[ -n "${ALIYUN_REPO:-}" ]]; then
              MIRROR="${ALIYUN_REPO}:${BUILD_TAG}-${ARCH}"
              docker tag "${IMAGE}" "${MIRROR}"
              docker push "${MIRROR}"
            fi
          fi

  image-release:
    name: Push Docker Images
    needs: image-build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Login to Github Container Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to Aliyun Registry
        if: ${{ env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Set image repo
        id: set_repo
        env:
          MODULE: ${{ inputs.module }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "GHCR_REPO=ghcr.io/${REPOSITORY_OWNER}/sealos-${MODULE}-service" >> "$GITHUB_ENV"
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            echo "ALIYUN_REPO=${ALIYUN_REPO_PREFIX}/sealos-${MODULE}-service" >> "$GITHUB_ENV"
          fi
      - name: Download digests
        if: ${{ inputs.module == 'account' }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.module }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        if: ${{ inputs.module == 'account' }}
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
            ${{ env.ALIYUN_REPO }}
          tags: |
            type=raw,value=${{ env.BUILD_TAG }},enable=${{ inputs.module == 'vlogs' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.push_image_tag }},enable=${{ inputs.push_image_tag != '' && inputs.push_image_tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9
      - name: Create manifest list and push
        if: ${{ inputs.module == 'account' }}
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_REPO: ${{ env.GHCR_REPO }}
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${GHCR_REPO}@sha256:${digest}")
          done
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${IMAGE_SOURCE}" \
              -t "$TAG" "${sources[@]}"
            sleep 5
          done
      - name: Merge and publish runtime manifests
        if: ${{ inputs.module == 'vlogs' }}
        env:
          IMAGE_REPO: ${{ env.GHCR_REPO }}
          MIRROR_REPO: ${{ env.ALIYUN_REPO }}
        run: bash service/vlogs/scripts/merge-images.sh

  cluster-image-build:
    needs:
      - image-release
    if: ${{ inputs.push_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image repo
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          MODULE: ${{ inputs.module }}
        run: |
          {
            echo "OLD_DOCKER_REPO=ghcr.io/labring/sealos-${MODULE}-service"
            echo "GHCR_DOCKER_REPO=ghcr.io/${REPO_OWNER}/sealos-${MODULE}-service"
            echo "GHCR_CLUSTER_REPO=ghcr.io/${REPO_OWNER}/sealos-cloud-${MODULE}-service"
            if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
              echo "ALIYUN_CLUSTER_REPO=${ALIYUN_REPO_PREFIX}/sealos-cloud-${MODULE}-service"
            fi
          } >> "$GITHUB_ENV"
      - name: Docker meta for cluster image
        if: ${{ inputs.module == 'account' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_CLUSTER_REPO }}
            ${{ env.ALIYUN_CLUSTER_REPO }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.push_image_tag }},enable=${{ inputs.push_image_tag != '' && inputs.push_image_tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9
      - name: Install sealos
        run: |
          sudo bash ./.github/scripts/install.sh
      - name: Sealos login to ghcr.io
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          sudo sealos login -u "$REPOSITORY_OWNER" -p "$GH_PAT" --debug ghcr.io
      - name: Sealos login to Aliyun Registry
        if: ${{ env.ALIYUN_REGISTRY }}
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          sudo sealos login -u "$ALIYUN_USERNAME" -p "$ALIYUN_PASSWORD" --debug "${ALIYUN_REGISTRY}"
      - name: Build and push account cluster image
        if: ${{ inputs.module == 'account' }}
        working-directory: service/account/deploy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            IMAGE_TAG="${TAG##*:}"
            NEW_DOCKER_IMAGE="${GHCR_DOCKER_REPO}:${IMAGE_TAG}"
            sed -i -E "s;(${OLD_DOCKER_REPO}|${GHCR_DOCKER_REPO}):[^[:space:]\"']*;${NEW_DOCKER_IMAGE};" charts/account-service/values.yaml
            sudo rm -rf registry
            sudo sealos build -t "${TAG}-${ARCH}" --platform "linux/${ARCH}" -f Kubefile
            sudo sealos push "${TAG}-${ARCH}"
          done
      - name: Login to GHCR
        if: ${{ inputs.module == 'vlogs' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to Aliyun
        if: ${{ inputs.module == 'vlogs' && env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Cache and package native cluster image
        if: ${{ inputs.module == 'vlogs' }}
        working-directory: service/vlogs/deploy
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # This run's merged runtime tag cannot be changed by another build.
          export VLOGS_IMAGE="${GHCR_DOCKER_REPO}:${BUILD_TAG}"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          values = pathlib.Path("charts/vlogs-service/values.yaml")
          content, count = re.subn(r"^image: .+$", "image: " + os.environ["VLOGS_IMAGE"], values.read_text(), flags=re.M)
          if count != 1:
              raise SystemExit("expected exactly one vlogs image in chart defaults")
          values.write_text(content)
          PY
          sudo sealos registry save --registry-dir=registry --arch "${ARCH}" --images="${VLOGS_IMAGE}"
          IMAGE="${GHCR_CLUSTER_REPO}:${BUILD_TAG}-${ARCH}"
          docker build -f Kubefile -t "${IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
          docker push "${IMAGE}"
          if [[ -n "${ALIYUN_CLUSTER_REPO:-}" ]]; then
            MIRROR="${ALIYUN_CLUSTER_REPO}:${BUILD_TAG}-${ARCH}"
            docker tag "${IMAGE}" "${MIRROR}"
            docker push "${MIRROR}"
          fi

  cluster-image-release:
    name: Merge cluster image manifests
    needs: cluster-image-build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image repo
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          MODULE: ${{ inputs.module }}
        run: |
          {
            echo "OLD_DOCKER_REPO=ghcr.io/labring/sealos-${MODULE}-service"
            echo "GHCR_DOCKER_REPO=ghcr.io/${REPO_OWNER}/sealos-${MODULE}-service"
            echo "GHCR_CLUSTER_REPO=ghcr.io/${REPO_OWNER}/sealos-cloud-${MODULE}-service"
            if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
              echo "ALIYUN_CLUSTER_REPO=${ALIYUN_REPO_PREFIX}/sealos-cloud-${MODULE}-service"
            fi
          } >> "$GITHUB_ENV"
      - name: Docker meta for cluster image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_CLUSTER_REPO }}
            ${{ env.ALIYUN_CLUSTER_REPO }}
          tags: |
            type=raw,value=${{ env.BUILD_TAG }},enable=${{ inputs.module == 'vlogs' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.push_image_tag }},enable=${{ inputs.push_image_tag != '' && inputs.push_image_tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9
      - name: Login to GHCR
        if: ${{ inputs.module == 'vlogs' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to Aliyun
        if: ${{ inputs.module == 'vlogs' && env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Merge and publish cluster manifests
        if: ${{ inputs.module == 'vlogs' }}
        env:
          IMAGE_REPO: ${{ env.GHCR_CLUSTER_REPO }}
          MIRROR_REPO: ${{ env.ALIYUN_CLUSTER_REPO }}
        run: bash service/vlogs/scripts/merge-images.sh
      - name: Install sealos
        if: ${{ inputs.module == 'account' }}
        run: |
          sudo bash ./.github/scripts/install.sh
      - name: Sealos login to ghcr.io
        if: ${{ inputs.module == 'account' }}
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          sudo sealos login -u "$REPOSITORY_OWNER" -p "$GH_PAT" --debug ghcr.io
      - name: Sealos login to Aliyun Registry
        if: ${{ inputs.module == 'account' && env.ALIYUN_REGISTRY }}
        env:
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          sudo sealos login -u "$ALIYUN_USERNAME" -p "$ALIYUN_PASSWORD" --debug "${ALIYUN_REGISTRY}"
      - name: Merge and publish account cluster manifests
        if: ${{ inputs.module == 'account' }}
        run: |
          set -euo pipefail
          for TAG in $DOCKER_METADATA_OUTPUT_TAGS; do
            sudo sealos manifest create "${TAG}"
            for arch in amd64 arm64; do
              sudo sealos manifest add "${TAG}" "docker://${TAG}-${arch}"
            done
            sudo sealos manifest push --all "${TAG}" "docker://${TAG}"
          done
