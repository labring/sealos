name: Build Frontends Image

on:
  workflow_call:
    inputs:
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: "Push image tag"
        default: "latest"
        required: false
        type: string
      force_all:
        description: "Force build all modules (for release)"
        default: false
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image"
        required: false
        type: boolean
        default: false
      push_image_tag:
        description: "Push image tag"
        default: "latest"
        required: false
        type: string
  push:
    branches: ["*"]
    paths:
      - "frontend/desktop/**"
      - "frontend/providers/**"
      - "frontend/packages/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/tsconfig*.json"
      - "frontend/Dockerfile"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontends.yml"
      - "!**/*.md"
  pull_request:
    branches: ["*"]
    paths:
      - "frontend/desktop/**"
      - "frontend/providers/**"
      - "frontend/packages/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/tsconfig*.json"
      - "frontend/Dockerfile"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/frontends.yml"
      - "!**/*.md"

# Avoid using ${{ github.workflow }} - when called via workflow_call, it inherits the caller's name causing conflicts
concurrency:
  group: frontends-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # paths-filter may need the merge-base; avoid its shallow-history deepen race.
          fetch-depth: 0
      - name: Verify shared frontend runtime settings
        run: grep -qx 'ENV UV_USE_IO_URING=0' frontend/Dockerfile
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            packages:
              - 'frontend/packages/**'
            root-config:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/tsconfig*.json'
              - 'frontend/Dockerfile'
              - '.github/workflows/frontend.yml'
              - '.github/workflows/frontends.yml'
            license:
              - 'frontend/providers/license/**'
            template:
              - 'frontend/providers/template/**'
            applaunchpad:
              - 'frontend/providers/applaunchpad/**'
            dbprovider:
              - 'frontend/providers/dbprovider/**'
            costcenter:
              - 'frontend/providers/costcenter/**'
            desktop:
              - 'frontend/desktop/**'
      - name: Generate build matrix
        id: set-matrix
        env:
          PACKAGES_CHANGED: ${{ steps.filter.outputs.packages }}
          ROOT_CONFIG_CHANGED: ${{ steps.filter.outputs.root-config }}
          FORCE_ALL: ${{ inputs.force_all }}
          EVENT_NAME: ${{ github.event_name }}
          LICENSE_CHANGED: ${{ steps.filter.outputs.license }}
          TEMPLATE_CHANGED: ${{ steps.filter.outputs.template }}
          APPLAUNCHPAD_CHANGED: ${{ steps.filter.outputs.applaunchpad }}
          DBPROVIDER_CHANGED: ${{ steps.filter.outputs.dbprovider }}
          COSTCENTER_CHANGED: ${{ steps.filter.outputs.costcenter }}
          DESKTOP_CHANGED: ${{ steps.filter.outputs.desktop }}
        run: |
          modules=()

          # Check if we need to build all modules
          if [[ "$PACKAGES_CHANGED" == "true" || \
                "$ROOT_CONFIG_CHANGED" == "true" || \
                "$FORCE_ALL" == "true" || \
                "$EVENT_NAME" == "workflow_dispatch" ]]; then
            modules=(
              "providers/license"
              "providers/template"
              "providers/applaunchpad"
              "providers/dbprovider"
              "providers/costcenter"
              "desktop"
            )
          else
            # Only build changed modules
            [[ "$LICENSE_CHANGED" == "true" ]] && modules+=("providers/license")
            [[ "$TEMPLATE_CHANGED" == "true" ]] && modules+=("providers/template")
            [[ "$APPLAUNCHPAD_CHANGED" == "true" ]] && modules+=("providers/applaunchpad")
            [[ "$DBPROVIDER_CHANGED" == "true" ]] && modules+=("providers/dbprovider")
            [[ "$COSTCENTER_CHANGED" == "true" ]] && modules+=("providers/costcenter")
            [[ "$DESKTOP_CHANGED" == "true" ]] && modules+=("desktop")
          fi

          # Convert to JSON array (compact format for GitHub Actions)
          if [ ${#modules[@]} -eq 0 ]; then
            json_modules="[]"
          else
            json_modules=$(printf '%s\n' "${modules[@]}" | jq -R . | jq -s -c .)
          fi
          echo "modules=$json_modules" >> "$GITHUB_OUTPUT"
          echo "Building modules: $json_modules"

  helm-validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Validate Helm charts
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if [[ "${MODULE}" == "providers/template" ]]; then
            bash frontend/providers/template/deploy/verify-template-repo-config.sh
          fi

          chart_root="frontend/${MODULE}/deploy/charts"
          if [[ ! -d "${chart_root}" ]]; then
            echo "No Helm chart found for ${MODULE}; skipping"
            exit 0
          fi

          found=false
          while IFS= read -r -d '' chart_file; do
            found=true
            chart_dir=$(dirname "${chart_file}")
            chart_name=$(basename "${chart_dir}")
            user_values=$(find "${chart_dir}" -maxdepth 1 -type f -name '*-values.yaml' -print -quit)

            helm lint "${chart_dir}"
            helm template "${chart_name}" "${chart_dir}" \
              --namespace "${chart_name}" >/dev/null

            if [[ -n "${user_values}" ]]; then
              helm lint "${chart_dir}" --values "${user_values}"
              helm template "${chart_name}" "${chart_dir}" \
                --namespace "${chart_name}" \
                --values "${user_values}" >/dev/null
            fi
          done < <(find "${chart_root}" -mindepth 2 -maxdepth 2 -name Chart.yaml -print0)

          if [[ "${found}" == "false" ]]; then
            echo "No Helm chart found for ${MODULE}; skipping"
          fi

  image-build:
    needs:
      - detect-changes
      - helm-validate
    if: needs.detect-changes.outputs.modules != '[]'
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}
    with:
      module: ${{ matrix.module }}
      push_image: ${{ (github.event_name == 'push') || (github.event_name == 'create') || (inputs.push_image == true) }}
      push_image_tag: ${{ inputs.push_image_tag }}
