name: Build native vlogs images

on:
  workflow_call:
    inputs:
      push_image:
        type: boolean
        default: false
      push_image_tag:
        type: string
        default: latest

env:
  GO_VERSION: "1.25"
  GHCR_RUNTIME_REPO: ghcr.io/${{ github.repository_owner }}/sealos-vlogs-service
  GHCR_CLUSTER_REPO: ghcr.io/${{ github.repository_owner }}/sealos-cloud-vlogs-service
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_REPO_PREFIX: ${{ secrets.ALIYUN_REPO_PREFIX && secrets.ALIYUN_REPO_PREFIX || secrets.ALIYUN_USERNAME && format('{0}/{1}', secrets.ALIYUN_REGISTRY, secrets.ALIYUN_USERNAME) || '' }}
  BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read
  packages: write

jobs:
  runtime-build:
    name: Build runtime (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go on native runner
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Login to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun
        if: ${{ inputs.push_image && env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Compile native binary
        working-directory: service/vlogs
        env:
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "linux/${ARCH}"
          go build -trimpath -ldflags "-s -w" -o bin/manager .

      - name: Package and publish native runtime image
        env:
          ARCH: ${{ matrix.arch }}
          PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          set -euo pipefail
          IMAGE="${GHCR_RUNTIME_REPO}:${BUILD_TAG}-${ARCH}"
          docker build -f service/vlogs/Dockerfile -t "${IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" service/vlogs
          if [[ "${PUSH_IMAGE}" == true ]]; then
            docker push "${IMAGE}"
            if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
              MIRROR="${ALIYUN_REPO_PREFIX}/sealos-vlogs-service:${BUILD_TAG}-${ARCH}"
              docker tag "${IMAGE}" "${MIRROR}"
              docker push "${MIRROR}"
            fi
          fi

  runtime-release:
    name: Merge runtime manifests
    needs: runtime-build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun
        if: ${{ env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set mirror repository
        run: |
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            echo "MIRROR_REPO=${ALIYUN_REPO_PREFIX}/sealos-vlogs-service" >> "$GITHUB_ENV"
          fi

      - name: Runtime image metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_RUNTIME_REPO }}
            ${{ env.MIRROR_REPO }}
          tags: |
            type=raw,value=${{ env.BUILD_TAG }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.push_image_tag }},enable=${{ inputs.push_image_tag != '' && inputs.push_image_tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9

      - name: Merge and publish runtime manifests
        env:
          IMAGE_REPO: ${{ env.GHCR_RUNTIME_REPO }}
        run: bash service/vlogs/scripts/merge-images.sh

  cluster-build:
    name: Build cluster image (${{ matrix.arch }})
    needs: runtime-release
    if: ${{ inputs.push_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native Sealos
        run: sudo bash .github/scripts/install.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun
        if: ${{ env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Cache and package native cluster image
        working-directory: service/vlogs/deploy
        env:
          ARCH: ${{ matrix.arch }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This run's merged runtime tag cannot be changed by another build.
          export VLOGS_IMAGE="${GHCR_RUNTIME_REPO}:${BUILD_TAG}"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          values = pathlib.Path("charts/vlogs-service/values.yaml")
          content, count = re.subn(r"^image: .+$", "image: " + os.environ["VLOGS_IMAGE"], values.read_text(), flags=re.M)
          if count != 1:
              raise SystemExit("expected exactly one vlogs image in chart defaults")
          values.write_text(content)
          PY
          sudo sealos login -u "${REPO_OWNER}" -p "${GH_TOKEN}" ghcr.io
          sudo sealos registry save --registry-dir=registry --arch "${ARCH}" --images="${VLOGS_IMAGE}"
          IMAGE="${GHCR_CLUSTER_REPO}:${BUILD_TAG}-${ARCH}"
          docker build -f Kubefile -t "${IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
          docker push "${IMAGE}"
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            MIRROR="${ALIYUN_REPO_PREFIX}/sealos-cloud-vlogs-service:${BUILD_TAG}-${ARCH}"
            docker tag "${IMAGE}" "${MIRROR}"
            docker push "${MIRROR}"
          fi

  cluster-release:
    name: Merge cluster image manifests
    needs: cluster-build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun
        if: ${{ env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set mirror repository
        run: |
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            echo "MIRROR_REPO=${ALIYUN_REPO_PREFIX}/sealos-cloud-vlogs-service" >> "$GITHUB_ENV"
          fi

      - name: Cluster image metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_CLUSTER_REPO }}
            ${{ env.MIRROR_REPO }}
          tags: |
            type=raw,value=${{ env.BUILD_TAG }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.push_image_tag }},enable=${{ inputs.push_image_tag != '' && inputs.push_image_tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9

      - name: Merge and publish cluster manifests
        env:
          IMAGE_REPO: ${{ env.GHCR_CLUSTER_REPO }}
        run: bash service/vlogs/scripts/merge-images.sh
