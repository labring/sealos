name: Release Cloud

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag for manual release"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for manual release"
        required: false
        default: ""
        type: string

env:
  # Common versions
  GO_VERSION: "1.25"
  DEFAULT_OWNER: "labring"

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  release-controllers:
    uses: ./.github/workflows/controllers.yml
    with:
      push_image: true
      push_image_tag: ${{ inputs.tag }}
      disable_cilint: true
      force_all: true
    secrets: inherit

  release-frontends:
    uses: ./.github/workflows/frontends.yml
    with:
      push_image: true
      push_image_tag: ${{ inputs.tag }}
      force_all: true
    secrets: inherit

  release-service:
    uses: ./.github/workflows/services.yml
    with:
      push_image: true
      push_image_tag: ${{ inputs.tag }}
      disable_cilint: true
      force_all: true
    secrets: inherit

  release-webhook:
    uses: ./.github/workflows/webhooks.yml
    with:
      push_image: true
      push_image_tag: ${{ inputs.tag }}
      disable_cilint: true
    secrets: inherit

  release-components:
    needs:
      - release-controllers
      - release-frontends
      - release-service
      - release-webhook
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REPO_PREFIX: ${{ secrets.ALIYUN_REPO_PREFIX && secrets.ALIYUN_REPO_PREFIX || secrets.ALIYUN_USERNAME && format('{0}/{1}', secrets.ALIYUN_REGISTRY, secrets.ALIYUN_USERNAME) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image repositories
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "GHCR_REPO=ghcr.io/${REPOSITORY_OWNER}/sealos/sealos-cloud-components" >> "$GITHUB_ENV"
          if [[ -n "${ALIYUN_REPO_PREFIX}" ]]; then
            echo "ALIYUN_REPO=${ALIYUN_REPO_PREFIX}/sealos/sealos-cloud-components" >> "$GITHUB_ENV"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REPO }}
            ${{ env.ALIYUN_REPO }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' && inputs.tag != 'latest' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 9

      - name: Install sealos
        run: sudo bash ./.github/scripts/install.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Registry
        if: ${{ env.ALIYUN_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and publish component cluster images
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            export IMAGE_TAG="${tag##*:}"
            context="${RUNNER_TEMP}/sealos-cloud-components-${IMAGE_TAG}"
            bash deploy/sealos-cloud/init.sh "$context"
            sudo sealos login -u "${{ github.repository_owner }}" -p "$GHCR_TOKEN" --debug ghcr.io
            if [[ -n "$ALIYUN_REGISTRY" ]]; then
              sudo sealos login -u "$ALIYUN_USERNAME" -p "$ALIYUN_PASSWORD" --debug "$ALIYUN_REGISTRY"
            fi
            (
              cd "$context"
              sudo sealos build -t "${tag}-amd64" --platform linux/amd64 -f Kubefile .
              sudo sealos build -t "${tag}-arm64" --platform linux/arm64 -f Kubefile .
            )
            sudo sealos push "${tag}-amd64"
            sudo sealos push "${tag}-arm64"
            sudo sealos manifest create "$tag"
            sudo sealos manifest add "$tag" "docker://${tag}-amd64"
            sudo sealos manifest add "$tag" "docker://${tag}-arm64"
            sudo sealos manifest push --all "$tag" "docker://${tag}"
            rm -rf "$context"
          done <<< "$IMAGE_TAGS"
