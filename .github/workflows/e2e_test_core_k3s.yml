name: E2E Sealos Core Test for K3s

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/e2e_test_core_k3s.yml"
      - "lifecycle/cmd/**"
      - "lifecycle/pkg/**"
      - "lifecycle/test/**"
  pull_request:
    branches: ["*"]
    paths:
      - ".github/workflows/e2e_test_core_k3s.yml"
      - "lifecycle/cmd/**"
      - "lifecycle/pkg/**"
      - "lifecycle/test/**"

# Avoid using ${{ github.workflow }} - when called via workflow_call, it inherits the caller's name causing conflicts
concurrency:
  group: e2e-test-core-k3s-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-changes:
    runs-on: ubuntu-24.04
    outputs:
      run_e2e: ${{ steps.set.outputs.run_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Detect non-test lifecycle changes
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          if bash ./scripts/has-non-test-changes.sh ./lifecycle "${BASE_REF}" "${{ github.sha }}"; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  call_ci_workflow:
    needs: [resolve-changes]
    if: ${{ needs.resolve-changes.outputs.run_e2e == 'true' }}
    uses: ./.github/workflows/import-patch-image.yml
    with:
      arch: amd64
      e2e: true
      image: false
  e2e-core-test:
    needs: [resolve-changes, call_ci_workflow]
    if: ${{ needs.resolve-changes.outputs.run_e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        unit: [E2E_sealos_k3s_basic_test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download image-cri-shim
        uses: actions/download-artifact@v4
        with:
          name: image-cri-shim-amd64
          path: /tmp/
      - name: Download sealctl
        uses: actions/download-artifact@v4
        with:
          name: sealctl-amd64
          path: /tmp/
      - name: Download sealos
        uses: actions/download-artifact@v4
        with:
          name: sealos-amd64
          path: /tmp/
      - name: Download e2e test
        uses: actions/download-artifact@v4
        with:
          name: e2e.test
          path: /tmp/
      - name: Verify sealos
        run: |
          sudo chmod a+x /tmp/{sealos,image-cri-shim,sealctl}
          sudo mv /tmp/sealos /usr/bin/
          sudo sealos version
      - name: Remove containerd && docker
        uses: labring/sealos-action@v0.0.7
        with:
          type: prune
      - name: Verify E2e test
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          sudo apt-get remove docker docker-engine docker.io containerd runc
          sudo apt-get purge docker-ce docker-ce-cli containerd.io # docker-compose-plugin
          sudo apt-get remove -y moby-engine moby-cli moby-buildx moby-compose
          sudo rm -rf /var/run/docker.sock
          sudo rm -rf /run/containerd/containerd.sock
          sudo chmod a+x /tmp/e2e.test
          sudo /tmp/e2e.test --ginkgo.v --ginkgo.focus="$UNIT"
