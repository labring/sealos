# User-editable defaults. Image, names, certificates and ports are chart-owned.
replicaCount: 1

config:
  cnameDomains: cloud.sealos.io,laf.dev,laf.run
  cnameCheck: true
  denyDomains: ""
  ingressMutatingAnnotations: ""
  ingressWebhookEnabled: true
  ingressWebhookFailurePolicy: Fail
  namespaceWebhookEnabled: true
  namespaceWebhookFailurePolicy: Fail
  resourceCreatorWebhookEnabled: false
  resourceCreatorWebhookFailurePolicy: Fail
  icpEnabled: false
  icpEndpoint: ""
  icpKey: ""
  icpKeySecretRef:
    name: ""
    key: ICP_KEY
