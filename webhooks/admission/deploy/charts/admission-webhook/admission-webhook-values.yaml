# User-editable defaults. Image, names, certificates and ports are chart-owned.
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

updateStrategy:
  maxSurge: 1

config:
  cnameDomains: cloud.sealos.io,laf.dev,laf.run
  cnameCheck: true
  denyDomains: ""
  ingressMutatingAnnotations: ""
  ingressWebhookEnabled: true
  ingressWebhookFailurePolicy: Fail
  namespaceWebhookEnabled: true
  namespaceWebhookFailurePolicy: Fail
  resourceCreatorWebhookEnabled: true
  resourceCreatorWebhookFailurePolicy: Fail
  icpEnabled: false
  icpEndpoint: ""
  icpKey: ""
  icpKeySecretRef:
    name: ""
    key: ICP_KEY

metrics:
  enabled: true

webhook:
  timeoutSeconds: 5
