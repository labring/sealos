apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mutate-resource-creator.sealos.io
  admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-resource-creator
  failurePolicy: Fail
  timeoutSeconds: 5
  sideEffects: None
  namespaceSelector:
    matchExpressions:
      - key: user.sealos.io/owner
        operator: Exists
  rules:
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [deployments, statefulsets]
      scope: Namespaced
    - apiGroups: [devbox.sealos.io]
      apiVersions: [v1alpha2]
      operations: [CREATE, UPDATE]
      resources: [devboxes]
      scope: Namespaced
    - apiGroups: [objectstorage.sealos.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [objectstoragebuckets]
      scope: Namespaced
    - apiGroups: [batch]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [cronjobs]
      scope: Namespaced
    - apiGroups: [apps.kubeblocks.io]
      apiVersions: [v1alpha1, v1]
      operations: [CREATE, UPDATE]
      resources: [clusters]
      scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: validate-resource-creator.sealos.io
  admissionReviewVersions: [v1]
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-resource-creator
  failurePolicy: Fail
  timeoutSeconds: 5
  sideEffects: None
  namespaceSelector:
    matchExpressions:
      - key: user.sealos.io/owner
        operator: Exists
  rules:
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [deployments, statefulsets]
      scope: Namespaced
    - apiGroups: [devbox.sealos.io]
      apiVersions: [v1alpha2]
      operations: [CREATE, UPDATE]
      resources: [devboxes]
      scope: Namespaced
    - apiGroups: [objectstorage.sealos.io]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [objectstoragebuckets]
      scope: Namespaced
    - apiGroups: [batch]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [cronjobs]
      scope: Namespaced
    - apiGroups: [apps.kubeblocks.io]
      apiVersions: [v1alpha1, v1]
      operations: [CREATE, UPDATE]
      resources: [clusters]
      scope: Namespaced
