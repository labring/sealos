{{- if .Values.runtimeClass.create }}
{{- if ne .Values.runtimeClass.name .Values.webhook.runtimeClass }}
{{- fail "runtimeClass.name and webhook.runtimeClass must match" }}
{{- end }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "stargz-webhook.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler }}
scheduling:
  nodeSelector:
    {{- toYaml .Values.runtimeClass.nodeSelector | nindent 4 }}
{{- end }}
