apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stargz-webhook.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    {{- include "stargz-webhook.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stargz-webhook.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stargz-webhook.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "stargz-webhook.selectorLabels" . | nindent 4 }}
{{- end }}
