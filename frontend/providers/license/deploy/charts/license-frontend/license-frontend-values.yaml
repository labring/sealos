# Custom values for license frontend helm chart.
# This file contains user-customizable configurations.

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 128Mi

# License business configuration
# Customize these settings based on your requirements
licenseConfig:
  licensePurchaseDomain: "license.sealos.io"

startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# Affinity for pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - license-frontend
          topologyKey: "kubernetes.io/hostname"
