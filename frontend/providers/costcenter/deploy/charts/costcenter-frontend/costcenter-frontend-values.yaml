# Custom values for costcenter frontend helm chart.
# This file contains user-customizable configurations.

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Costcenter business configuration
# Customize these settings based on your requirements
costcenterConfig:
  cloudDomain: "127.0.0.1.nip.io"
  cloudPort: ""
  httpPort: ""
  disableHttps: false
  regionUID: "randomRegionUID"
  certSecretName: "wildcard-cert"
  tlsRejectUnauthorized: "1"
  transferEnabled: true
  currencyType: "shellCoin"
  rechargeRequiresRealName: false
  giftCodeEnabled: true
  subscriptionEnabled: false
  gpuEnabled: false

  # Invoice configuration
  invoice:
    enabled: false
    feiShuBotURL: ""
    feishuApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      template:
        id: ""
        version: ""
    serviceToken: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
    billingInfo:
      companyName: ""
      addressLines: []
      contactLines: []

  # Recharge configuration
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""

  # Component URLs
  components:
    accountService:
      url: "http://account-service.account-system.svc:2333"
    desktop:
      url: "http://desktop-frontend.sealos.svc:3000"
