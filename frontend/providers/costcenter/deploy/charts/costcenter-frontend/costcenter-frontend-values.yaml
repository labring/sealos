# Custom values for costcenter frontend helm chart.
# This file contains user-customizable configurations.

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Costcenter business configuration
# Customize these settings based on your requirements
costcenterConfig:
  transferEnabled: true
  currencyType: "shellCoin"

  # Invoice configuration
  invoice:
    enabled: false
    feiShuBotURL: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""

  # Recharge configuration
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""

  # Component URLs
  components:
    accountService:
      url: "http://account-service.account-system.svc:2333"

# App-local health checks; override these objects with Helm -f/--set.
# Startup protects initialization; readiness gates traffic; liveness restarts hung containers.
startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

# helm test uses the same app-local health endpoint.
tests:
  image: busybox:1.36.1
  path: /healthz
