
replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi
startupProbe:
  httpGet:
    path: /api/platform/getAppConfig
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /api/platform/getAppConfig
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /api/platform/getAppConfig
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
# Costcenter frontend configuration
# Note: jwtInternal is auto-configured by entrypoint.sh from sealos-config ConfigMap
# For business configurations (transfer, invoice, recharge, etc.), see costcenter-frontend-values.yaml
costcenterConfig:
  transferEnabled: true
  invoice:
    enabled: false
    # Deprecated compatibility key. Prefer invoice.feishApp.feiShuBotURL.
    feiShuBotURL: ""
    feishApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      templateId: ""
      templateVersion: ""
    serviceToken: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""
  components:
    accountService:
      url: "http://account-service.account-system.svc:2333"

# Affinity for pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - costcenter-frontend
          topologyKey: "kubernetes.io/hostname"
