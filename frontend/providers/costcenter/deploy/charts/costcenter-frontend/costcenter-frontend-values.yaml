
replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi
readinessProbe:
  httpGet:
    path: /api/platform/getClientAppConfig
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 3
  failureThreshold: 3
# Costcenter frontend configuration
# Note: jwtInternal is auto-configured by entrypoint.sh from sealos-config ConfigMap
# For business configurations (transfer, invoice, recharge, etc.), see costcenter-frontend-values.yaml
costcenterConfig:
  invoice:
    enabled: false
    serviceToken: ""
    feishuApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      templateId: ""
      templateVersion: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
    billingInfo:
      companyName: ""
      addressLines: []
      contactLines: []
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""
  components:
    billing:
      url: "http://account-service.account-system.svc:2333"
      secret: ""
    desktop:
      url: "http://desktop-frontend.sealos.svc:3000"

# Affinity for pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - costcenter-frontend
          topologyKey: "kubernetes.io/hostname"
