# Custom values for costcenter frontend helm chart.
# This file contains user-customizable configurations.

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Costcenter business configuration
# Customize these settings based on your requirements
costcenterConfig:
  transferEnabled: true
  currencyType: "shellCoin"

  # Invoice configuration
  invoice:
    enabled: false
    serviceToken: ""
    # Preferred main-schema values key.
    feishuApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      template:
        id: ""
        version: ""
    # Legacy release-v5.1 values accepted for existing installations.
    feishApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      templateId: ""
      templateVersion: ""
    # Legacy webhook-only values accepted for existing installations.
    feiShuBotURL: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
    billingInfo:
      companyName: ""
      addressLines: []
      contactLines: []

  # Recharge configuration
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""

  # Component URLs
  components:
    billing:
      url: ""
      secret: ""
    desktop:
      url: "http://desktop-frontend.sealos.svc:3000"
    # Legacy values key retained for existing overrides.
    accountService:
      url: "http://account-service.account-system.svc:2333"
