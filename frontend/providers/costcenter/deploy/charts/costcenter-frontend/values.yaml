# Default values for costcenter frontend helm chart.

image: ghcr.io/labring/sealos-costcenter-frontend:latest
imagePullPolicy: Always

imagePullSecrets: []
fullnameOverride: "costcenter-frontend"

podAnnotations: {}
podLabels: {}

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - 'ALL'

service:
  type: ClusterIP
  port: 3000

ingress:
  className: nginx
  host: ""
  annotations: {}

startupProbe:
  httpGet:
    path: /api/platform/getClientAppConfig
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /api/platform/getClientAppConfig
    port: 3000
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /api/platform/getClientAppConfig
    port: 3000
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Costcenter frontend configuration
# Note: jwtInternal is auto-configured by entrypoint.sh from sealos-config ConfigMap
# For business configurations (transfer, invoice, recharge, etc.), see costcenter-frontend-values.yaml
costcenterConfig:
  cloudDomain: "127.0.0.1.nip.io"
  cloudPort: ""
  httpPort: ""
  disableHttps: false
  regionUID: "randomRegionUID"
  certSecretName: "wildcard-cert"
  tlsRejectUnauthorized: "1"
  jwtInternal: ""  # Auto-injected by entrypoint script
  transferEnabled: true
  currencyType: "shellCoin"
  rechargeRequiresRealName: false
  giftCodeEnabled: true
  subscriptionEnabled: false
  gpuEnabled: false
  invoice:
    enabled: false
    feiShuBotURL: ""
    feishuApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      template:
        id: ""
        version: ""
    # Accept the release-v5.1 spelling while rendering only the main schema key.
    feishApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      templateId: ""
      templateVersion: ""
    serviceToken: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
    billingInfo:
      companyName: ""
      addressLines: []
      contactLines: []
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""
  components:
    billing:
      url: ""
      secret: ""
    # Legacy values key retained for existing overrides.
    accountService:
      url: "http://account-service.account-system.svc:2333"
    desktop:
      url: "http://desktop-frontend.sealos.svc:3000"

# Affinity for pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - costcenter-frontend
          topologyKey: "kubernetes.io/hostname"
