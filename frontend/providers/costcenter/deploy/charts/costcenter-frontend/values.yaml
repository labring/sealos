# Default values for costcenter frontend helm chart.

image: ghcr.io/labring/sealos-costcenter-frontend:latest
imagePullPolicy: Always

imagePullSecrets: []
fullnameOverride: "costcenter-frontend"

replicaCount: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - 'ALL'

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

readinessProbe:
  httpGet:
    path: /api/platform/getClientAppConfig
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 3
  failureThreshold: 3

# Costcenter frontend configuration
# Note: jwtInternal is auto-configured by entrypoint.sh from sealos-config ConfigMap
# For business configurations (transfer, invoice, recharge, etc.), see costcenter-frontend-values.yaml
costcenterConfig:
  cloudDomain: "127.0.0.1.nip.io"
  cloudPort: 443
  regionUID: ""
  certSecretName: "wildcard-cert"
  jwtInternal: ""
  features:
    rechargeRequiresRealName: false
    transfer: true
    giftCode: true
    subscription: false
    gpu: false
  currencySymbol: "shellCoin"
  meta:
    scripts: []
    noscripts: []
  invoice:
    enabled: false
    serviceToken: ""
    feishuApp:
      appId: ""
      appSecret: ""
      feiShuBotURL: ""
      chatId: ""
      token: ""
      templateId: ""
      templateVersion: ""
    aliSms:
      endpoint: ""
      accessKeyID: ""
      accessKeySecret: ""
      templateCode: ""
      signName: ""
      invoiceCompletedTemplateCode: ""
    mongo:
      uri: ""
    billingInfo:
      companyName: ""
      addressLines: []
      contactLines: []
  recharge:
    enabled: false
    payMethods:
      wechat:
        enabled: false
      alipay:
        enabled: false
      stripe:
        enabled: false
        publicKey: ""
  components:
    billing:
      url: "http://account-service.account-system.svc:2333"
      secret: ""
    desktop:
      url: "http://desktop-frontend.sealos.svc:3000"

# Affinity for pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app"
                operator: In
                values:
                  - costcenter-frontend
          topologyKey: "kubernetes.io/hostname"
