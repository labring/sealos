# Custom values for desktop frontend helm chart.
# This file contains user-customizable configurations.
#
# Note: The following configurations are automatically fetched from sealos-system/sealos-config ConfigMap
# and do NOT need to be manually configured:
#   - cloudDomain, cloudPort, regionUID
#   - jwtInternal, jwtRegional, jwtGlobal
#   - passwordSalt
#   - databaseGlobalCockroachdbURI, databaseLocalCockroachdbURI
#
# See values.yaml for chart defaults and auto-configured reference values.

replicaCount: 1

databaseMigration:
  # Disable only when database migrations are managed separately.
  enabled: true

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Desktop frontend configuration (user-customizable)
desktopConfig:
  proxyDomain: ""

  # Billing configuration
  billingUrl: "http://account-service.account-system.svc:2333"
  billingToken: ""
  cloudVitrualMachineUrl: ""

  # Currency and language configuration
  # Options: "cn" (Chinese) or "en" (English)
  # currencySymbol is auto-configured based on version:
  # - version: "cn" → currencySymbol: "shellCoin"
  # - version: "en" → currencySymbol: "usd"
  version: "cn"

  allowedAllOrigins: true
  # Authentication secrets (auto-configured from sealos-config)
  passwordSalt: "randomSalt"       # Auto-fetched from sealos-config.passwordSalt
  jwtInternal: ""                  # Auto-fetched from sealos-config.jwtInternal
  jwtRegional: ""                  # Auto-fetched from sealos-config.jwtRegional
  jwtGlobal: ""                    # Auto-fetched from sealos-config.jwtGlobal
  # Supported values: cockroachdb, postgresql
  databaseType: cockroachdb
  # Database connections (auto-configured from sealos-config)
  databaseGlobalCockroachdbURI: ""     # Auto-fetched from sealos-config.databaseGlobalCockroachdbURI
  databaseLocalCockroachdbURI: ""      # Auto-fetched from sealos-config.databaseLocalCockroachdbURI

  # Google Tag Manager
  gtmId: ""

  # Discord invite link (USD version only)
  discordInviteLink: ""

  # Feature flags
  guideEnabled: false
  apiEnabled: false
  rechargeEnabled: false
  enterpriseRealNameAuthEnabled: false
  trackingEnabled: false
  realNameAuthEnabled: false
  kcRotationEnabled: false

  # Common URLs (default values)
  realNameReward: 0
  realNameCallbackUrl: "https://cloud.example.org/api/account/faceIdRealNameAuthCallback"
  cfSiteKey: ""

  # Desktop layout configuration
  layoutTitle: "Sealos Cloud"
  layoutLogo: "/logo.svg"
  layoutBackgroundImage: "/images/bg-light.svg"
  workspaceResourceHeaderEnabled: true
  customerServiceURL: ""
  layoutDocsUseDocs: false
  layoutDocsUrl: "https://sealos.run/docs/Intro/"
  layoutGithubStarEnabled: true
  layoutWorkorderEnabled: false
  layoutAccountSettingEnabled: true
  layoutAiAssistantEnabled: false
  layoutBannerEnabled: false
  layoutAnnouncementEnabled: false

  authTitle:
    zh: "欢迎来到 Sealos"
    en: "Welcome to Sealos"
  authBackgroundImage:
    zh: "/images/bg-light.svg"
    en: "/images/bg-light.svg"
  protocol:
    enabled: false
    serviceProtocol:
      zh: https://sealos.io/zh-Hans/docs/msa/terms-of-service
      en: https://sealos.io/docs/msa/terms-of-service
    privateProtocol:
      zh: https://sealos.io/zh-Hans/docs/msa/privacy-policy
      en: https://sealos.io/docs/msa/privacy-policy
  # Meta tags
  metaTitle: "Sealos Cloud"
  metaDescription: "Sealos Cloud"
  metaKeywords: "Sealos Cloud"

  signUpEnabled: false
  baiduToken: ""
  bingAdTenant: ""
  bingAdClientId: ""
  bingAdClientSecret: ""
  bingAdRefreshToken: ""
  bingAdDeveloperToken: ""
  bingAdCustomerId: 0
  bingAdCustomerAccountId: 0
  bingAdConversionName: ""

  passwordEnabled: true
  # OAuth providers
  githubEnabled: false
  githubClientId: ""
  githubClientSecret: ""
  githubProxyAddress: ""

  wechatEnabled: false
  wechatClientId: ""
  wechatClientSecret: ""
  wechatProxyAddress: ""

  googleEnabled: false
  googleClientId: ""
  googleClientSecret: ""
  googleProxyAddress: ""

  oauth2Enabled: false
  oauth2Pkce: false
  oauth2CallbackUrl: ""
  oauth2ClientId: ""
  oauth2ClientSecret: ""
  oauth2AuthUrl: ""
  oauth2TokenUrl: ""
  oauth2UserInfoUrl: ""
  oauth2ProxyAddress: ""
  oauth2DisplayName: ""

  # Captcha configuration
  turnstileEnabled: false
  turnstileSiteKey: ""
  turnstileSecretKey: ""

  # SMS configuration (Aliyun)
  smsEnabled: false
  smsAliEnabled: false
  smsAliEndpoint: ""
  smsAliTemplateCode: ""
  smsAliSignName: ""
  smsAliAccessKeyID: ""
  smsAliAccessKeySecret: ""

  # Email configuration
  emailEnabled: false
  emailHost: ""
  emailPort: 0
  emailUser: ""
  emailPassword: ""
  emailLanguage: ""

  # Ali captcha configuration
  aliCaptchaEnabled: false
  aliCaptchaEndpoint: ""
  aliCaptchaSceneId: ""
  aliCaptchaPrefix: ""
  aliCaptchaAccessKeyID: ""
  aliCaptchaAccessKeySecret: ""

  inviteEnabled: false
  inviteLafSecretKey: ""
  inviteLafBaseURL: ""

  # Tracking configuration
  trackingWebsiteId: ""
  trackingHostUrl: ""

  # RealName OSS configuration
  realNameOSSAccessKey: ""
  realNameOSSAccessKeySecret: ""
  realNameOSSEndpoint: ""
  realNameOSSSSL: false
  realNameOSSPort: 0
  realNameOSSRealNameBucket: ""
  realNameOSSEnterpriseRealNameBucket: ""

  # Workorder and cloud virtual machine URLs
  workorderUrl: ""

  # Team management
  maxTeamCount: 0
  maxTeamMemberCount: 0
  workspaceInviteExpiresInMinutes:
    - 30
    - 1440
    - 10080
startupProbe:
  httpGet:
    path: /healthz
    port: 3000
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 3
  timeoutSeconds: 2
  successThreshold: 3
  failureThreshold: 3
