replicaCount: 1

image: ghcr.io/labring/sealos-vlogs-service:latest
imagePullPolicy: Always
imagePullSecrets: []
podAnnotations: {}

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 5m
    memory: 64Mi

service:
  port: 8428

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 6

# Backend authentication is optional; configure it when vmauth requires it.
# Override these settings in vlogs-values.yaml before installing.
serviceVlogsConfig:
  path: "http://usr-vlc-victoria-logs-cluster-vmauth.vlc.svc:8427"
  username: ""
  password: ""
  whitelistKubernetesHosts: ""
