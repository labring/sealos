{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vlogs.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vlogs.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yml: |
    server:
      addr: {{ printf ":%v" .Values.containerPort | quote }}
      path: {{ .Values.config.path | quote }}
      username: {{ .Values.config.username | quote }}
      password: {{ .Values.config.password | quote }}
{{- end }}
