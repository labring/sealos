replicaCount: 1

image: ghcr.io/labring/sealos-database-service:latest
imagePullPolicy: Always

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 5m
    memory: 64Mi

service:
  port: 9090

databaseMonitorConfig:
  prometheusServiceHost: "http://vmselect-vm-stack-victoria-metrics-k8s-stack.vm.svc:8481/select/0/prometheus/"
